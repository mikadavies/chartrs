[package]
name = "chartrs"
version = "0.1.0"
edition = "2024"
authors = ["Mika Davies <mika.davies.nt@gmail.com>"]
description = "A simple and customisable plotting library. [WIP]"
repository = "https://github.com/mikadavies/chartrs"
readme = "README.md"
license = "MIT"

[dependencies]
euclid = "0.22.11"
minifb = { version = "0.28.0", default-features = false, optional = true }
raqote = { version = "0.8.5", default-features = false }
rusttype = { version = "0.9.3", optional = true }

[features]
default = ["text", "interactive", "x11"]
# Plotting options
text = ["dep:rusttype"]
png  = ["raqote/png"]
# Interactive plot options
interactive = ["dep:minifb"]
wayland     = ["minifb/wayland", "minifb/dlopen"]
x11         = ["minifb/x11"]
# Miscellaneous
unstable = ["euclid/unstable"]
