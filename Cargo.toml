[package]
name = "chartrs"
version = "0.1.0"
edition = "2024"

[dependencies]
euclid = "0.22.11"
minifb = { version = "0.28.0", default-features = false, optional = true }
raqote = { version = "0.8.5", default-features = false }
rusttype = { version = "0.9.3", optional = true }

[features]
default = ["text", "interactive", "x11"]
# Plotting options
text = ["dep:rusttype"]
png  = ["raqote/png"]
# Interactive plot options
interactive = ["dep:minifb"]
wayland     = ["minifb/wayland", "minifb/dlopen"]
x11         = ["minifb/x11"]
# Miscellaneous
unstable = ["euclid/unstable"]

[profile.dev]
lto = "off"
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"
opt-level = 3
